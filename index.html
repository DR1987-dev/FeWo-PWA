<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f9fc" />
    <meta name="description" content="Private Ferienwohnungsverwaltung als Progressive Web App" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="assets/icons/icon-192.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="assets/icons/icon-192.svg" />
    <link rel="stylesheet" href="assets/styles.css" />
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <title>FeWo Manager</title>
  </head>
  <body>
    <header class="topbar">
      <div>
        <p class="eyebrow">Ferienwohnung</p>
        <h1>FeWo Manager</h1>
      </div>
      <button id="settingsButton" class="icon-button" aria-label="Einstellungen">
        <span aria-hidden="true">[=]</span>
      </button>
    </header>

    <main id="app" class="app-shell">
      <section id="networkBanner" class="network-banner" hidden>
        Offline-Modus aktiv. Es werden nur gecachte Daten angezeigt.
      </section>

      <section id="view-dashboard" class="view active" data-view="dashboard"></section>
      <section id="view-expenses" class="view" data-view="expenses"></section>
      <section id="view-bookings" class="view" data-view="bookings"></section>
      <section id="view-reports" class="view" data-view="reports"></section>
    </main>

    <nav class="tabbar" aria-label="Hauptnavigation">
      <button class="tab active" data-route="dashboard">Dashboard</button>
      <button class="tab" data-route="expenses">Ausgaben</button>
      <button class="tab" data-route="bookings">Buchungen</button>
      <button class="tab" data-route="reports">Reports</button>
    </nav>

    <dialog id="settingsDialog" class="sheet">
      <form id="settingsForm" method="dialog">
        <h2>Verbindung</h2>
        <label>
          Datenquelle
          <select name="dataSource" required>
            <option value="sheet">Google Sheet (direkt)</option>
            <option value="backend">Apps Script API</option>
          </select>
        </label>
        <label>
          Spreadsheet ID oder URL
          <input name="spreadsheetId" type="text" placeholder="1AbC... oder komplette Google-Sheets-URL" />
        </label>
        <label>
          Google OAuth Client ID
          <input name="googleClientId" type="text" placeholder="1234567890-xxxxx.apps.googleusercontent.com" />
        </label>
        <div class="test-row">
          <button id="googleAuthBtn" type="button" class="ghost">Google Auth starten</button>
          <p id="googleAuthStatus" class="helper status-note" role="status" aria-live="polite"></p>
        </div>
        <p class="helper">Hinweis: Direkter Sheet-Zugriff funktioniert nur, wenn das Spreadsheet per Link lesbar ist (oder als Web veroeffentlicht).</p>
        <label>
          API Base URL
          <input name="baseUrl" type="url" placeholder="https://script.google.com/macros/s/.../exec" />
        </label>
        <label>
          APP_TOKEN
          <input name="appToken" type="password" placeholder="Optionaler Token" />
        </label>
        <label class="switch-row">
          <span>Dunkelmodus</span>
          <input name="darkMode" type="checkbox" />
        </label>
        <div class="test-row">
          <button id="testConnectionBtn" type="button" class="ghost">Verbindung testen</button>
          <p id="connectionTestResult" class="helper status-note" role="status" aria-live="polite"></p>
        </div>
        <menu>
          <button value="cancel" class="ghost">Abbrechen</button>
          <button id="saveSettingsBtn" value="default">Speichern</button>
        </menu>
      </form>
    </dialog>

    <dialog id="bookingDialog" class="sheet">
      <div id="bookingDialogBody"></div>
    </dialog>

    <script type="module" src="js/main.js"></script>
  </body>
</html>
