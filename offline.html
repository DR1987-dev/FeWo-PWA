<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f7f9fc" />
    <title>Offline | FeWo Manager</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Avenir Next", sans-serif;
        background: radial-gradient(circle at top, #ffffff, #eef4ff);
        color: #0f172a;
      }
      article {
        max-width: 420px;
        margin: 24px;
        padding: 24px;
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.8);
        border: 1px solid rgba(15, 23, 42, 0.12);
        text-align: center;
      }
      h1 { margin-top: 0; }
    </style>
  </head>
  <body>
    <article>
      <h1>Aktuell offline</h1>
      <p>Die App ist installiert, aber das Netzwerk ist derzeit nicht erreichbar.</p>
      <p>Sobald die Verbindung zurueck ist, aktualisiert sich die Ansicht automatisch.</p>
    </article>
  </body>
</html>
